name: Local-Action-Test

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC token claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Test ssm-to-env local json
        uses: ./
        id: ssm-to-env-local-json
        with:
          ssm-path: /actions-testing/test-parameter
          decryption: false

      - name: Test ssm-to-env local encrypted
        uses: ./
        id: ssm-to-env-local-encrypted
        with:
          ssm-path: /actions-testing/test-parameter-encrypted
          decryption: true

      - name: Test ssm-to-env local non-json
        uses: ./
        id: ssm-to-env-local-non-json
        with:
          ssm-path: /actions-testing/test-parameter-basic
          decryption: false

      - name: Test for Env Variables
        run: |
          set -euo pipefail

          echo "Validating exported environment variables..."

          assert_env_var() {
            local var_name="$1"
            local expected_value="$2"
            local actual_value="${!var_name:-}"

            if [[ "$actual_value" != "$expected_value" ]]; then
              echo "[ERROR] Environment variable validation failed for ${var_name}"
              echo "[ERROR] Expected: ${expected_value}"
              echo "[ERROR] Actual:   ${actual_value:-<unset>}"
              exit 1
            fi

            echo "[OK] ${var_name} is set correctly"
          }

          assert_env_var "APPLICATION_URL" "https://api.com"
          assert_env_var "DB_NAME" "somedbname"
          assert_env_var "TEST_PARAMETER_ENCRYPTED" "some_secret"
          assert_env_var "TEST_PARAMETER_BASIC" "basic_value"

          echo "Environment variable validation passed."
